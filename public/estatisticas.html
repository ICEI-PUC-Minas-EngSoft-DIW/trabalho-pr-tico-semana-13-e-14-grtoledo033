<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estatísticas - Charles Henriquepédia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">📊 Estatísticas Charles Henriquepédia</h1>
      <nav>
        <a href="index.html" class="text-white text-decoration-none me-3">Início</a>
        <a href="estatisticas.html" class="text-warning text-decoration-none">Estatísticas</a>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <section class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Distribuição dos Momentos</h3>
          </div>
          <div class="card-body">
            <canvas id="graficoPizza"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h3>Relevância dos Momentos</h3>
          </div>
          <div class="card-body">
            <canvas id="graficoBarras"></canvas>
          </div>
        </div>
      </div>
    </section>

    <section class="mt-5">
      <div class="card">
        <div class="card-header">
          <h3>Dados dos Momentos</h3>
        </div>
        <div class="card-body">
          <div id="tabelaDados"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chart-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
